{% extends "base.html" %}
{% macro body() %}
<div class="max-w-lg mx-auto px-4 py-14">
  <div class="card p-7 text-center">
    <h1 class="text-xl font-extrabold">{{ cohort.name }}</h1>
    <p class="mt-3 text-slate-600">{{ t('join.full') if full else t('join.closed') }}</p>
    <a href="{{ url_for('public.home') }}#request" class="btn-secondary mt-5">{{ t('pub.cta_request') }}</a>
  </div>
</div>
{% endmacro %}
{% block public %}{{ body() }}{% endblock %}
{% block content %}{{ body() }}{% endblock %}

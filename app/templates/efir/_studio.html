{# Общий вид конструктора эфиров (hub.html, build.html): стиль отчетов «Келешек» - синяя шапка, светлые панели. #}
<link rel="icon" type="image/png" sizes="32x32" href="{{ static_v('img/favicon-32.png') }}">
{% include "efir/_style.html" %}
<style>
  :root{--focus:#0075f2}
  body{background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.45}
  .bgfx{display:none}
  a{color:inherit}
  header.top{position:sticky;top:0;z-index:30;background:var(--cover);color:#fff;box-shadow:0 6px 20px -12px rgba(0,60,160,.6)}
  header.top .in{max-width:1600px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header.top img{height:30px;width:auto}
  header.top .ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
  header.top .crumb{color:#cdeeff;text-decoration:none;font-weight:600;font-size:13px}
  header.top .crumb:hover{color:#fff}
  header.top .btn{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08);border-radius:999px}
  header.top .btn:hover{background:#fff;color:#0057c8;border-color:#fff}
  header.top .seg{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);border-radius:999px}
  header.top .seg button{color:#fff;border-radius:999px}
  header.top .seg button.on{background:#fff;color:#0057c8}
  header.top .langs a{color:#cdeeff}
  header.top .langs a.on{color:#fff}
  .sp{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s,color .15s}
  .btn:hover{border-color:var(--sea);color:var(--blue)}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 6px 18px -8px rgba(0,105,218,.7)}
  .btn.pri:hover{background:var(--sea);color:#fff}
  .btn.soft{background:var(--tint);border-color:transparent;color:var(--blue)}
  .btn.soft:hover{background:var(--chip)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}
  .btn.ghost:hover{color:var(--blue);background:var(--tint)}
  .btn.danger{color:var(--red);border-color:rgba(229,72,77,.4);background:var(--card)}
  .btn.danger:hover{background:var(--red-soft)}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .langs a{color:var(--mute);text-decoration:none;font-size:12px;font-weight:700;margin-left:8px}
  .langs a.on{color:var(--text)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--mute);border:0}
  .chip.live{background:var(--red);color:#fff}
  .chip.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
  .chip.soon{background:var(--tint);color:var(--blue)}
  .chip.done{background:var(--green-soft);color:var(--green)}
  .chip.draft{color:var(--mute)}
  .chip.archived{color:var(--dim)}
  @keyframes blink{50%{opacity:.25}}
  .in-l{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin:0 0 6px}
  .in-l small{color:var(--mute);font-weight:400}
  input.f,textarea.f,select.f{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 14px var(--f-body);outline:none;transition:border-color .15s,box-shadow .15s}
  textarea.f{resize:vertical;min-height:44px;line-height:1.45}
  input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(0,117,242,.15)}
  input.f::placeholder,textarea.f::placeholder{color:var(--dim)}
  input.f:disabled{background:var(--chip);color:var(--mute)}
  select.f{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
  .hintx{color:var(--mute);font-size:12.5px;margin-top:6px;line-height:1.45}
  .other{color:var(--mute);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .other b{color:var(--blue);font-family:var(--f-mono);font-weight:500;margin-right:6px}
  .modal{position:fixed;inset:0;z-index:60;background:rgba(10,30,60,.45);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
  .modal.on{display:flex;animation:fade .18s ease}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;width:100%;max-width:620px;padding:24px;box-shadow:0 30px 80px -20px rgba(0,30,80,.45);animation:pop .22s cubic-bezier(.2,.9,.3,1.2);position:relative;overflow:hidden}
  .modal .box::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--grad)}
  .modal .box.wide{max-width:860px}
  .modal h3{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.01em}
  .modal .sub{color:var(--mute);margin-bottom:18px;line-height:1.45}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  @keyframes fade{from{opacity:0}}
  @keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--card);font-weight:600;border-radius:12px;padding:11px 16px;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .toast.err{background:var(--red);color:#fff}
  .seg{display:inline-flex;background:var(--chip);border:1px solid transparent;border-radius:12px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--mute);font:600 12.5px var(--f-body);padding:6px 11px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,30,80,.15)}
  .spin{width:16px;height:16px;border:2px solid rgba(0,117,242,.25);border-top-color:var(--sea);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
  header.top .spin,.btn.pri .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
  @keyframes rot{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <title>{{ t('live.overlay_title') }}</title>
  {% include "efir/_style.html" %}
  <style>
    html,body{width:100%;height:100%;overflow:hidden;background:transparent}
    #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#fff}
    .box{position:absolute;right:40px;bottom:40px;display:flex;gap:18px;align-items:center;background:linear-gradient(120deg,rgba(0,87,200,.94),rgba(0,117,242,.94) 55%,rgba(24,156,217,.94));border:1px solid rgba(255,255,255,.3);border-radius:22px;box-shadow:0 20px 50px -20px rgba(0,30,90,.6);padding:16px 22px 16px 16px;backdrop-filter:blur(6px)}
    .qr{width:150px;height:150px;background:#fff;border-radius:12px;padding:6px}
    .qr svg{width:100%;height:100%;display:block}
    .t1{font-size:26px;font-weight:800;line-height:1.1}
    .t2{font-family:var(--f-mono);font-size:18px;color:#cdeeff;margin-top:6px;font-weight:500}
    .cnt{margin-top:12px;font-size:22px;font-weight:600}
    .cnt b{font-size:30px;font-variant-numeric:tabular-nums}
    .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#22c55e;margin-right:8px;animation:blink 1.4s infinite}
    @keyframes blink{50%{opacity:.35}}
    .bar{position:absolute;left:40px;top:40px;display:none;align-items:center;gap:14px;background:#fff;color:#0057c8;border-radius:999px;padding:14px 26px;font-size:30px;font-weight:800;box-shadow:0 20px 50px -20px rgba(0,30,90,.6)}
    .grad-line{position:absolute;left:0;right:0;bottom:0;height:6px}
  </style>
</head>
<body>
<div id="stage">
  <div class="bar" id="bar">⚡ <span id="bar-t"></span></div>
  <div class="box">
    <div class="qr">{{ qr }}</div>
    <div>
      <div class="t1">{{ t('live.ov_join') }}</div>
      <div class="t2">{{ pretty(links.academy) }}</div>
      <div class="cnt"><span class="dot"></span>{{ t('live.scr_online') }} <b id="n">0</b></div>
    </div>
  </div>
</div>
<script>
(function () {
  var SLUG = {{ ev.slug|tojson }}, KEY = {{ key|tojson }};
  var T = {{ {'question': t('live.ov_question'), 'profile': t('live.ov_profile'), 'ask': t('live.ov_ask')}|tojson }};
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  function poll() {
    fetch('/efir/' + SLUG + '/screen.json?key=' + encodeURIComponent(KEY), {cache: 'no-store'}).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('n').textContent = (d.stats && d.stats.online) || 0;
      var m = d.state && d.state.mode, txt = T[m];
      document.getElementById('bar').style.display = txt ? 'flex' : 'none';
      if (txt) document.getElementById('bar-t').textContent = txt;
    }).catch(function () {}).finally(function () { setTimeout(poll, 2000); });
  }
  poll();
})();
</script>
</body>
</html>

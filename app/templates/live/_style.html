<style>
  :root{
    --ink:#0b0b12; --bg:#0b0b12; --card:#16161f; --line:#2a2a38; --mute:#9a9ab0; --text:#f4f4f8;
    --blue:#2f5bff; --violet:#8a2be2; --red:#e8323c; --orange:#ff6a1a; --green:#22c55e;
    --grad:linear-gradient(90deg,#2f5bff 0%,#8a2be2 38%,#e8323c 72%,#ff6a1a 100%);
    --k0:#e21b3c; --k1:#1368ce; --k2:#d89e00; --k3:#26890c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .grad-line{height:3px;background:var(--grad);border-radius:2px}
  .shape{display:inline-block;width:1em;height:1em;flex:none}
  .shape svg{width:100%;height:100%;display:block}
</style>

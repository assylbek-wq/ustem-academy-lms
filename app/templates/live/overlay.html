<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <title>{{ t('live.overlay_title') }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  {% include "live/_style.html" %}
  <style>
    html,body{width:100%;height:100%;overflow:hidden;background:transparent}
    #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#fff}
    .box{position:absolute;right:40px;bottom:40px;display:flex;gap:18px;align-items:center;background:rgba(11,11,18,.88);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:16px 22px 16px 16px;backdrop-filter:blur(6px)}
    .qr{width:150px;height:150px;background:#fff;border-radius:12px;padding:6px}
    .qr svg{width:100%;height:100%;display:block}
    .t1{font-size:26px;font-weight:900;line-height:1.1}
    .t2{font-size:19px;color:#c9c9d6;margin-top:6px;font-weight:700}
    .cnt{margin-top:12px;font-size:22px;font-weight:800}
    .cnt b{font-size:30px;font-variant-numeric:tabular-nums}
    .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#22c55e;margin-right:8px;animation:blink 1.4s infinite}
    @keyframes blink{50%{opacity:.35}}
    .bar{position:absolute;left:40px;top:40px;display:none;align-items:center;gap:14px;background:var(--grad);border-radius:16px;padding:14px 22px;font-size:30px;font-weight:900}
    .grad-line{position:absolute;left:0;right:0;bottom:0;height:6px}
  </style>
</head>
<body>
<div id="stage">
  <div class="bar" id="bar">⚡ <span id="bar-t"></span></div>
  <div class="box">
    <div class="qr">{{ qr }}</div>
    <div>
      <div class="t1">{{ t('live.ov_join') }}</div>
      <div class="t2">{{ pretty(links.academy) }}</div>
      <div class="cnt"><span class="dot"></span>{{ t('live.scr_online') }} <b id="n">0</b></div>
    </div>
  </div>
</div>
<script>
(function () {
  var SLUG = {{ ev.slug|tojson }}, KEY = {{ key|tojson }};
  var T = {{ {'question': t('live.ov_question'), 'profile': t('live.ov_profile'), 'ask': t('live.ov_ask')}|tojson }};
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  function poll() {
    fetch('/live/' + SLUG + '/screen.json?key=' + encodeURIComponent(KEY), {cache: 'no-store'}).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('n').textContent = (d.stats && d.stats.online) || 0;
      var m = d.state && d.state.mode, txt = T[m];
      document.getElementById('bar').style.display = txt ? 'flex' : 'none';
      if (txt) document.getElementById('bar-t').textContent = txt;
    }).catch(function () {}).finally(function () { setTimeout(poll, 2000); });
  }
  poll();
})();
</script>
</body>
</html>
